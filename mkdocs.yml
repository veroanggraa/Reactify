site_name: Reactify
site_description: 'Metaball-style "gooey" UI for Compose Multiplatform: shapes that merge, stretch a neck, and pinch apart as items animate from a source into a target.'
site_author: 'Veronica (veroanggraa)'
site_url: 'https://veroanggraa.github.io/Reactify'
edit_uri: 'tree/main/docs/'
remote_branch: gh-pages

docs_dir: docs

# Navigation
nav:
  - 'Overview': index.md
  - 'Getting Started': getting-started.md
  - 'Transfer': transfer.md
  - 'Bottom Navigation Indicator': nav-indicator.md
  - 'Segmented Control': segmented-control.md
  - 'Choosing a Renderer': renderers.md
  - 'Sample App': sample-app.md
  - 'Changelog': CHANGELOG.md

# Repository
repo_name: 'Reactify'
repo_url: 'https://github.com/veroanggraa/Reactify'

# Configuration
theme:
  name: 'material'
  language: 'en'
  icon:
    logo: material/blur

  palette:
    primary: 'deep purple'
    accent: 'deep purple'
    scheme: slate

  font:
    text: 'Roboto'
    code: 'JetBrains Mono'

  features:
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - footnotes
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
